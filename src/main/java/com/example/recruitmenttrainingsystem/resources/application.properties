# =======================================
# C?U HÌNH SERVER
# =======================================
# C?ng server (m?c ??nh là 8080)
server.port=8080

# =======================================
# C?U HÌNH DATABASE (MySQL)
# =======================================
# Thay 'recruitment_training_db' b?ng tên database c?a b?n
# Thay 'your_username' và 'your_password' b?ng thông tin ??ng nh?p MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/recruitment_training_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================================
# C?U HÌNH JPA / HIBERNATE
# =======================================
# 'update' s? t? ??ng c?p nh?t schema (c?u trúc b?ng) khi kh?i ??ng.
# (Trong môi tr??ng production, b?n nên dùng 'validate' ho?c 'none')
spring.jpa.hibernate.ddl-auto=update

# Hi?n th? các câu l?nh SQL trong console (h?u ích cho vi?c debug)
spring.jpa.show-sql=true

# Ch? ??nh ph??ng ng? (dialect) c?a MySQL ?? Hibernate t?i ?u hóa
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =======================================
# C?U HÌNH BÍ M?T JWT (cho JwtUtil.java)
# =======================================
# T?p JwtUtil.java c?a b?n s? d?ng @Value("${jwt.secret}").
# B?n PH?I thay th? giá tr? bên d??i b?ng m?t chu?i bí m?t an toàn c?a riêng b?n.
jwt.secret=your-very-strong-and-secret-key-that-no-one-can-guess-32-chars-long-at-least